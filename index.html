<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFAF8" />
    <script>
      try {
        var t = localStorage.getItem("chanjai-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="th_TH" />
    <meta property="og:site_name" content="จันทร์ใจ" />
    <meta
      property="og:title"
      content="จันทร์ใจ — ให้ไพ่กระซิบ สิ่งที่ใจอยากรู้"
    />
    <meta
      property="og:description"
      content="เปิดไพ่ประจำวันฟรี พักใจ แล้วให้ไพ่เป็นเพื่อนคุยกับใจ พร้อมเก็บผลเป็นภาพสวย ๆ"
    />
    <meta
      name="description"
      content="จันทร์ใจ พื้นที่เล็ก ๆ ให้คุณได้ฟังเสียงหัวใจ เปิดไพ่ประจำวันฟรี ดูไพ่ความรัก การงาน และเก็บช่วงเวลาดี ๆ เป็นภาพแชร์ได้"
    />
    <title>จันทร์ใจ — ให้ไพ่กระซิบ สิ่งที่ใจอยากรู้</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
